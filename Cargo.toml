[package]
name = "godric"
version = "0.1.0"
edition = "2024"
default-run = "main"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features] 
mock_backend = []

[dependencies]
color-eyre = "0.6.3"
dotenv = "0.15.0"
futures = "0.3.31"
iced = { version = "0.14", features = ["tokio", "image", "canvas"] }
image = "0.25.6"
okolors = "0.8.1"
rand = "0.8.5"
reqwest = { version = "0.12.10", features = ["cookies", "blocking"] }
ron = "0.12.0"
scraper = "0.20.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"
sysinfo = "0.31.4"
tempfile = "3.20.0"
thirtyfour = "0.34.0"
thiserror = "1.0.69"
tokio = { version = "1.42.0", features = ["full"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4"] }
